<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}Cyrene{% endblock %}</title>

    <script>
        const savedTheme = localStorage.getItem("theme") || "blue";
        document.documentElement.dataset.theme = savedTheme;
    </script>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">✦</div>

            <div class="brand-name">
                Cyrene
            </div>
        </div>

        <nav class="navigation">

            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                <span class="nav-icon">
                    <img
                        src="/static/images/Home.webp"
                        alt="Home">
                </span>
                <span>Home</span>
            </a>

            <a href="/characters" class="nav-item {% if request.path == '/characters' %}active{% endif %}">
                <span class="nav-icon">
                    <img
                        src="/static/images/Characters.webp"
                        alt="Characters">
                </span>
                <span>Characters</span>
            </a>

            <a href="/weapons" class="nav-item {% if request.path == '/weapons' %}active{% endif %}">
                <span class="nav-icon">
                    <img
                        src="/static/images/Weapons.webp"
                        alt="Weapons">
                </span>
                <span>Weapons</span>
            </a>

            <a href="/planner" class="nav-item {% if request.path == '/planner' %}active{% endif %}">
                <span class="nav-icon">
                    <img
                        src="/static/images/Planner.webp"
                        alt="Planner">
                </span>
                <span>Planner</span>
            </a>

            <a href="/achievements" class="nav-item {% if request.path == '/achievements' %}active{% endif %}">
                <span class="nav-icon">
                    <img
                        src="/static/images/Achievements.webp"
                        alt="Achievements">
                </span>
                <span>Achievements</span>
            </a>

            <a href="/wishes" class="nav-item {% if request.path == '/wishes' %}active{% endif %}">
                <span class="nav-icon">
                    <img
                        src="/static/images/Wishes.webp"
                        alt="Wishes">
                </span>
                <span>Wishes</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}">
                <span class="nav-icon">
                    <img
                        src="/static/images/Settings.webp"
                        alt="Settings">
                </span>
                <span>Settings</span>
            </a>
        
        </div>

    </aside>


    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <script src="/static/js/app.js"></script>
    <script src="/static/js/theme.js"></script>

</body>
</html>
