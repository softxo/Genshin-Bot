{% extends "base.html" %}

{% block title %}Cyrene • Planner{% endblock %}

{% block content %}

<div class="page">

    <section class="hero">

        <div class="hero-content">

            <span class="eyebrow">
                PLANNER
            </span>

            <h1>
                Your <span>Planner</span>
            </h1>

            <p>
                Your Resin and Events will appear here.
            </p>

        </div>

    </section>


    <!-- Loading -->

    <div id="planner-loading" class="planner-state">
        Loading planner...
    </div>


    <!-- Error -->

    <div
        id="planner-error"
        class="planner-state"
        hidden
    >
        <h2>Something went wrong</h2>

        <p>
            Cyrene couldn't load your planner data.
        </p>

        <button
            type="button"
            onclick="loadPlanner()"
        >
            Try Again
        </button>
    </div>


    <!-- Planner -->

    <div
        id="planner-content"
        class="planner-content"
        hidden
    >

        <!-- Accounts -->

        <section class="planner-section">

            <div class="section-header">

                <div>
                    <span class="eyebrow">
                        GENSHIN
                    </span>

                    <h2>
                        Accounts
                    </h2>
                </div>

            </div>

            <div
                id="accounts"
                class="planner-grid"
            ></div>

        </section>


        <!-- Reminders -->

        <section class="planner-section">

            <div class="section-header">

                <div>
                    <span class="eyebrow">
                        REMINDERS
                    </span>

                    <h2>
                        Reminders
                    </h2>
                </div>

            </div>

            <div
                id="reminders"
                class="planner-grid"
            ></div>

        </section>

    </div>

</div>


<style>

.planner-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
}

.planner-state h2 {
    margin-bottom: 8px;
    color: var(--text);
}

.planner-state p {
    margin-bottom: 20px;
    color: var(--text-muted);
}

.planner-state button {
    padding: 10px 18px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--surface);
    color: var(--text);

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease;
}

.planner-state button:hover {
    background: var(--surface-hover);
}


.planner-content {
    display: flex;
    flex-direction: column;
    gap: 40px;
}


.planner-section {
    width: 100%;
}


.section-header {
    margin-bottom: 18px;
}


.section-header h2 {
    margin: 4px 0 0;
}


.planner-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 16px;
}


.planner-card {
    padding: 22px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: 12px;

    box-sizing: border-box;
}


.planner-card h2,
.planner-card h3 {
    margin-top: 0;
    margin-bottom: 8px;

    color: var(--text);
}


.planner-card p {
    margin: 6px 0;

    color: var(--text-muted);
}


.planner-card strong {
    color: var(--text);
}


.planner-card hr {
    margin: 18px 0;

    border: 0;
    border-top: 1px solid var(--border);
}


@media (max-width: 700px) {

    .planner-grid {
        grid-template-columns: 1fr;
    }

}

</style>


<script>

async function loadPlanner() {

    const loading =
        document.getElementById("planner-loading");

    const content =
        document.getElementById("planner-content");

    const error =
        document.getElementById("planner-error");


    /*
     * Elements do or don't exist -
     */

    if (!loading || !content || !error) {

        console.error(
            "Planner HTML elements are missing."
        );

        return;
    }


    loading.hidden = false;
    content.hidden = true;
    error.hidden = true;


    try {

        const response = await fetch(
            "/api/planner",
            {
                credentials: "same-origin"
            }
        );


        if (response.status === 401) {

            window.location.href = "/";

            return;
        }


        if (!response.ok) {

            throw new Error(
                `Planner request failed: ${response.status}`
            );
        }


        const plannerData =
            await response.json();


        loading.hidden = true;
        content.hidden = false;


        renderPlanner(
            plannerData
        );


    } catch (exception) {

        console.error(
            "Failed to load planner:",
            exception
        );


        loading.hidden = true;
        content.hidden = true;
        error.hidden = false;
    }
}


function renderPlanner(
    plannerData
) {

    const accounts =
        document.getElementById("accounts");

    const reminders =
        document.getElementById("reminders");


    if (!accounts || !reminders) {

        console.error(
            "Planner containers are missing."
        );

        return;
    }


    accounts.innerHTML = "";
    reminders.innerHTML = "";


    /*
     * Accounts
     */

    for (
        const account of
        plannerData.accounts || []
    ) {

        const card =
            document.createElement("div");


        card.className =
            "planner-card";


        const name =
            account.nickname
            || account.genshin_uid;


        let resinStatus;


        if (
            account.replenished_at === null
            ||
            account.replenished_at === undefined
        ) {

            resinStatus = "Full";

        } else {

            resinStatus = `
                <span
                    data-timestamp="${account.replenished_at}"
                >
                    Loading...
                </span>
            `;
        }


        card.innerHTML = `

            <h2>
                ${name}
            </h2>

            <p>
                UID:
                ${account.genshin_uid}
            </p>

            <p>
                AR:
                ${account.level ?? "Unknown"}
            </p>

            <hr>

            <p>
                💧
                <strong>
                    ${account.current_resin}
                    /
                    ${account.max_resin}
                </strong>
                Resin
            </p>

            <p>
                Replenished:
                ${resinStatus}
            </p>

        `;


        accounts.appendChild(card);
    }


    /*
     * No accounts
     */

    if (
        !plannerData.accounts
        ||
        plannerData.accounts.length === 0
    ) {

        accounts.innerHTML = `
            <div class="planner-card">

                <h3>
                    No Genshin Accounts
                </h3>

                <p>
                    You don't currently have a
                    Genshin account linked to Cyrene.
                </p>

            </div>
        `;
    }


    /*
     * Reminders
     */

    for (
        const reminder of
        plannerData.reminders || []
    ) {

        const card =
            document.createElement("div");


        card.className =
            "planner-card";


        const amount =
            reminder.config?.amount;


        card.innerHTML = `

            <h3>
                ${reminder.type}
            </h3>

            <p>
                Mode:
                ${reminder.mode}
            </p>

            ${
                amount
                ?
                `<p>${amount} Resin</p>`
                :
                ""
            }

            <p>
                ${
                    reminder.enabled
                    ?
                    "Enabled"
                    :
                    "Disabled"
                }
            </p>

        `;


        reminders.appendChild(card);
    }


    /*
     * No reminders
     */

    if (
        !plannerData.reminders
        ||
        plannerData.reminders.length === 0
    ) {

        reminders.innerHTML = `
            <div class="planner-card">

                <h3>
                    No Reminders
                </h3>

                <p>
                    Your Resin and other reminders
                    will appear here.
                </p>

            </div>
        `;
    }


    updateTimestamps();
}


function updateTimestamps() {

    document
        .querySelectorAll("[data-timestamp]")
        .forEach(element => {

            const timestamp =
                Number(
                    element.dataset.timestamp
                );


            if (
                !Number.isFinite(timestamp)
            ) {

                element.textContent =
                    "Unknown";

                return;
            }


            const seconds =
                timestamp
                -
                Math.floor(
                    Date.now() / 1000
                );


            if (seconds <= 0) {

                element.textContent =
                    "Ready";

                return;
            }


            const minutes =
                Math.floor(
                    seconds / 60
                );


            if (minutes < 60) {

                element.textContent =
                    `in ${minutes}m`;

                return;
            }


            const hours =
                Math.floor(
                    minutes / 60
                );


            const remainingMinutes =
                minutes % 60;


            element.textContent =
                remainingMinutes === 0
                ?
                `in ${hours}h`
                :
                `in ${hours}h ${remainingMinutes}m`;
        });
}


loadPlanner();


setInterval(
    updateTimestamps,
    30_000
);

</script>

{% endblock %}
