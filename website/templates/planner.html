<script>

async function loadPlanner() {

    const loading = document.getElementById("planner-loading");
    const content = document.getElementById("planner-content");
    const error = document.getElementById("planner-error");

    try {

        const [plannerResponse, resinResponse] =
            await Promise.all([
                fetch("/api/planner", {
                    credentials: "same-origin"
                }),

                fetch("/api/planner/resin", {
                    credentials: "same-origin"
                })
            ]);

        if (
            plannerResponse.status === 401 ||
            resinResponse.status === 401
        ) {
            window.location.href = "/";
            return;
        }

        if (
            !plannerResponse.ok ||
            !resinResponse.ok
        ) {
            throw new Error(
                "Failed to load planner data."
            );
        }

        const plannerData =
            await plannerResponse.json();

        const resinData =
            await resinResponse.json();

        loading.hidden = true;
        content.hidden = false;

        renderPlanner(
            plannerData,
            resinData
        );

    } catch (exception) {

        console.error(exception);

        loading.hidden = true;
        error.hidden = false;
    }
}


function renderPlanner(
    plannerData,
    resinData
) {

    const accounts =
        document.getElementById("accounts");

    const reminders =
        document.getElementById("reminders");

    accounts.innerHTML = "";
    reminders.innerHTML = "";


    for (const account of resinData.accounts) {

        const card =
            document.createElement("div");

        card.className =
            "planner-card";

        const name =
            account.cyrene_nickname
            || account.nickname
            || account.genshin_uid;

        let resinStatus;

        if (
            account.replenished_at === null
        ) {
            resinStatus = "Full";
        } else {
            resinStatus =
                `<span data-timestamp="${account.replenished_at}">
                    Loading...
                </span>`;
        }

        card.innerHTML = `
            <h2>${name}</h2>

            <p>
                UID: ${account.genshin_uid}
            </p>

            <p>
                AR: ${account.level ?? "Unknown"}
            </p>

            <hr>

            <p>
                💧
                <strong>
                    ${account.current_resin}
                    /
                    ${account.max_resin}
                </strong>
                Resin
            </p>

            <p>
                Replenished:
                ${resinStatus}
            </p>
        `;

        accounts.appendChild(card);
    }


    for (const reminder of plannerData.reminders) {

        const card =
            document.createElement("div");

        card.className =
            "planner-card";

        const amount =
            reminder.config?.amount;

        card.innerHTML = `
            <h3>
                ${reminder.type}
            </h3>

            <p>
                Mode:
                ${reminder.mode}
            </p>

            ${
                amount
                ? `<p>${amount} Resin</p>`
                : ""
            }

            <p>
                ${
                    reminder.enabled
                    ? "Enabled"
                    : "Disabled"
                }
            </p>
        `;

        reminders.appendChild(card);
    }

    updateTimestamps();
}


function updateTimestamps() {

    document
        .querySelectorAll("[data-timestamp]")
        .forEach(element => {

            const timestamp =
                Number(
                    element.dataset.timestamp
                );

            const seconds =
                timestamp - Math.floor(
                    Date.now() / 1000
                );

            if (seconds <= 0) {
                element.textContent = "Ready";
                return;
            }

            const minutes =
                Math.floor(seconds / 60);

            if (minutes < 60) {

                element.textContent =
                    `in ${minutes}m`;

                return;
            }

            const hours =
                Math.floor(minutes / 60);

            const remainingMinutes =
                minutes % 60;

            element.textContent =
                remainingMinutes === 0
                ? `in ${hours}h`
                : `in ${hours}h ${remainingMinutes}m`;
        });
}


loadPlanner();

setInterval(
    updateTimestamps,
    30_000
);

</script>
