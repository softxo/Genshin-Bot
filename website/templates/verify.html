{% extends "base.html" %}

{% block title %}Cyrene • Verify{% endblock %}

{% block content %}

<div class="page verification-page">

    <section class="verification-panel">

        <h1>
            Verify your account
        </h1>

        <p class="verification-description">
            Use the code below with the
            <strong>/verify</strong>
            command in Discord.
        </p>

        <div class="verification-code">
            <span id="verification-code">
                Generating...
            </span>
        </div>

        <p
            id="verification-status"
            class="verification-status"
        >
            Awaiting Verification
        </p>

    </section>

</div>


<script>

(() => {

    let verificationToken = null;
    let polling = null;


    async function createVerification() {

        try {

            const response = await fetch(
                "/api/verify/create",
                {
                    method: "POST"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Failed to create verification request."
                );
            }

            const data =
                await response.json();

            verificationToken =
                data.token;

            document.getElementById(
                "verification-code"
            ).textContent =
                data.code;

            startPolling();

        } catch (error) {

            console.error(error);

            document.getElementById(
                "verification-status"
            ).textContent =
                "Unable to start verification.";

        }

    }


    function startPolling() {

        polling = setInterval(
            checkVerification,
            2000
        );

        checkVerification();

    }


    async function checkVerification() {

        if (!verificationToken) {
            return;
        }

        try {

            const response = await fetch(
                `/api/verify/status?token=${
                    encodeURIComponent(
                        verificationToken
                    )
                }`
            );

            if (response.status === 404) {

                clearInterval(polling);

                document.getElementById(
                    "verification-status"
                ).textContent =
                    "This verification request has expired. Please refresh the page.";

                return;
            }

            if (!response.ok) {
                return;
            }

            const data =
                await response.json();

            if (!data.verified) {
                return;
            }

            clearInterval(polling);

            document.getElementById(
                "verification-status"
            ).textContent =
                "Successfully connected to Discord.";

            setTimeout(() => {

                const next =
                    {{ next | tojson }};

                window.location.href =
                    next || "/planner";

            }, 800);

        } catch (error) {

            console.error(
                "Verification polling failed:",
                error
            );

        }

    }


    createVerification();

})();

</script>

{% endblock %}
