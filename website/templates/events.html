{% extends "base.html" %}

{% block title %}Cyrene • Events{% endblock %}

{% block content %}

<div class="page events-page">

    <section class="page-header">

        <div>
            <span class="eyebrow">
                ACTIVITIES
            </span>

            <h1>Events</h1>
        </div>

    </section>


    <section class="events-featured">
    
        <div class="event-featured-card">
            <img src="/static/images/events/Abyss.png" alt="Spiral Abyss" class="event-featured-image">
    
            <div class="event-featured-overlay"></div>
    
            <div class="event-featured-name">
                Spiral Abyss
            </div>
        </div>
    
    
        <div class="event-featured-card">
            <img src="/static/images/events/IT.png" alt="Imaginarium Theater" class="event-featured-image">
    
            <div class="event-featured-overlay"></div>
    
            <div class="event-featured-name">
                Imaginarium Theater
            </div>
        </div>
    
    
        <div class="event-featured-card">
            <img src="/static/images/events/Stygian.png" alt="Stygian Onslaught" class="event-featured-image">
    
            <div class="event-featured-overlay"></div>
    
            <div class="event-featured-name">
                Stygian Onslaught
            </div>
        </div>
    
    </section>

</div>

{% endblock %}
